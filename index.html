<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F2E9DC" />
    <!-- Theme before first paint: light by default, "dark" only if the visitor chose it
         (ThemeToggle stores it). Runs before any CSS, so there is no flash. -->
    <script>
      (function () {
        var t = 'light';
        try { if (localStorage.getItem('zt-theme') === 'dark') t = 'dark'; } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#070708');
        // Desktop cinematic intro (Hero.jsx): flag it before paint. Failsafe: if the
        // GSAP intro hasn't started after 5 s (JS blocked/failed), show the plain hero.
        if (window.matchMedia('(min-width: 768px) and (max-height: 1600px) and (prefers-reduced-motion: no-preference)').matches) {
          document.documentElement.classList.add('zt-intro');
          setTimeout(function () { if (!window.__ztIntro) document.documentElement.classList.remove('zt-intro'); }, 5000);
        }
      })();
    </script>
    <style>
      /* Critical inline styles: paint something meaningful immediately,
         before the JS bundle finishes downloading on slow connections. */
      html, body { background: #08090a; margin: 0; }
      html[data-theme="light"], html[data-theme="light"] body,
      html[data-theme="light"] #boot-loader { background: #F2E9DC; }
      #boot-loader {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        background: #08090a; z-index: 9999;
      }
      html[data-theme="light"] #boot-loader img { content: url('/zieltakt-logo-light.png'); }
      #boot-loader img { width: 140px; height: auto; opacity: 0.95; }
      #boot-loader .spinner {
        width: 28px; height: 28px; border-radius: 50%;
        border: 2.5px solid rgba(0, 224, 255, 0.15);
        border-top-color: #00e0ff;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      /* Once React mounts real content into #root, this rule hides the boot
         loader (it sits as the first child and gets pushed out / removed by
         main.jsx after mount). */
      #root:not(:empty) + #boot-loader { display: none; }
    </style>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ZielTakt" />
    <meta property="og:image" content="https://www.zieltakt.de/zieltakt-logo.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://www.zieltakt.de/zieltakt-logo.png" />
    <!-- Per-route title, description, canonical, og/twitter text and JSON-LD come from
         src/routes.js: injected at build time by scripts/prerender.js, kept in sync
         on the client by usePageMeta. -->
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <div id="boot-loader" aria-hidden="true">
      <img src="/zieltakt-logo.png" alt="" width="140" height="30" />
      <div class="spinner"></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
